<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1f1f23"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </radialGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="50%" stop-color="#242429"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997519"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="460" r="280" fill="none" stroke="#2a2a30" stroke-width="1" stroke-dasharray="4 6"/>
  <!-- Coiled Belt Body -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="480" r="210" fill="none" stroke="url(#leather)" stroke-width="48"/>
    <circle cx="400" cy="480" r="228" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle cx="400" cy="480" r="192" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="5 5"/>
    <!-- Outer Coil -->
    <path d="M 190 480 A 210 210 0 0 1 610 480" fill="none" stroke="url(#leather)" stroke-width="50"/>
    <path d="M 610 480 C 610 580 540 680 400 680 C 270 680 210 600 210 520 L 210 320" fill="none" stroke="url(#leather)" stroke-width="50" stroke-linecap="round"/>
    <!-- Holes -->
    <circle cx="210" cy="360" r="4.5" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="210" cy="400" r="4.5" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="210" cy="440" r="4.5" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="210" cy="480" r="4.5" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <!-- Luxury Buckle -->
    <g transform="translate(330, 210)">
      <rect x="0" y="0" width="140" height="95" rx="16" fill="none" stroke="url(#gold)" stroke-width="14" filter="url(#shadow)"/>
      <rect x="62" y="5" width="16" height="85" rx="4" fill="url(#gold)"/>
      <rect x="25" y="42" width="90" height="10" rx="3" fill="#18181b"/>
    </g>
  </g>
  <!-- Text Brand Label -->
  <text x="400" y="820" font-family="'Times New Roman', serif" font-size="28" letter-spacing="0.3em" fill="#f4f4f5" text-anchor="middle" font-weight="bold">COAG ATELIER</text>
  <text x="400" y="855" font-family="'Segoe UI', sans-serif" font-size="13" letter-spacing="0.4em" fill="#d4af37" text-anchor="middle">ITALIAN FULL-GRAIN LEATHER BELT</text>
  <text x="400" y="885" font-family="'Segoe UI', sans-serif" font-size="11" letter-spacing="0.25em" fill="#71717a" text-anchor="middle">35MM • BRUSHED TITANIUM CLASP</text>
</svg>
